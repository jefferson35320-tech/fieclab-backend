
spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  application:
    name: FiecLab

  main:
    allow-bean-definition-overriding: true

  mongodb:
    uri: ${MONGODB_URI:mongodb+srv://fillipesilva:Fiec2026@tigrinhos-fiec.xkgx0de.mongodb.net/fiecLab?retryWrites=true&w=majority}
  data:
    mongodb:
      autoindex-creation: true

  # Configuração OAuth2
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - profile
              - email
management:
  server:
    port: 9090          # porta separada, só acessível dentro do cluster
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  oauth2:
    redirect-uri: ${FRONTEND_OAUTH2_REDIRECT_URI:http://localhost:3000/oauth2/redirect}

# Só mantenha se algum FirebaseConfig seu lê essa propriedade
firebase:
  credentials-json: ${FIREBASE_CREDENTIALS_JSON:}