spring:
  application:
    name: FiecLab

  main:
    allow-bean-definition-overriding: true

  datasource:
    # URL de conexão com o banco de dados
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3310}/fiecLab?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true

    # Credenciais de acesso
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:1234}

    # Classe do Driver
    driver-class-name: com.mysql.cj.jdbc.Driver

    # Configurações do Pool de Conexões (HikariCP)
    hikari:
      pool-name: HikariPool-MySQL
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-timeout: 30000

  # Configurações do Hibernate / JPA
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # Configuração OAuth2
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - profile
              - email