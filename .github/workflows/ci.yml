name: CI Backend FiecLab

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17' # Se seu projeto for Java 21, altere para '21'
          distribution: 'temurin'
          cache: maven

      - name: Dar permissão de execução ao Maven Wrapper
        run: chmod +x mvnw

      - name: Compilar projeto (sem rodar testes com banco)
        run: ./mvnw clean package -DskipTests

      - name: Testar build da imagem Docker
        run: docker build . --file Dockerfile