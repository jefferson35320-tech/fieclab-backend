name: CI Backend FiecLab

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Dar permissão de execução ao Maven Wrapper
        run: chmod +x mvnw

      - name: Compilar e empacotar projeto
        run: ./mvnw clean package -DskipTests

  docker-build:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push'
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build e Push da Imagem Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/fieclab-backend:latest
            ${{ secrets.DOCKER_USERNAME }}/fieclab-backend:${{ github.sha }}

  deploy-k8s:
    runs-on: self-hosted
    needs: docker-build
    if: github.event_name == 'push'
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Aplicar manifests no Kubernetes
        run: kubectl apply -f deployment.yaml

      - name: Forçar novo rollout do backend
        run: kubectl rollout restart deployment/backend-deployment

      - name: Aguardar rollout concluir
        run: kubectl rollout status deployment/backend-deployment --timeout=180s
